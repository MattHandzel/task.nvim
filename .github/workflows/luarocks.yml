name: luarocks-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: LuaRocks Upload
        uses: nvim-neorocks/luarocks-tag-release@v7
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        with:
          summary: "Edit your Taskwarrior database like a Neovim buffer."
          detailed_description: |
            taskwarrior.nvim is an oil.nvim-inspired editor for Taskwarrior.
            Every vim motion, macro, and visual-mode operation becomes a task
            management operation for free.
          labels: |
            neovim
            taskwarrior
            note-taking
            productivity
          # No `dependencies:` block. Neovim itself isn't a luarock —
          # listing it as a dep makes `luarocks install` fail with
          # "Could not satisfy dependency neovim >= 0.9.0: No results
          # matching query were found for Lua 5.1." The Neovim version
          # check happens at plugin load (plugin/taskwarrior.lua).
